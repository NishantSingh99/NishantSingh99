<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather and News Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1><u>Weather News and Headlines</u></h1>

        <!-- Weather Section -->
        <div id="weather-info">
            <h2>Weather Information</h2>
            <p>Loading weather...</p>
        </div>

        <!-- News Section -->
        <div id="news-container">
            <h2>Latest News</h2>
            <p>Loading news...</p>
        </div>

        <!-- Headlines Section -->
        <div id="headlines-container">
            <h2>Headlines</h2>
            <p>Loading headlines...</p>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
